{% macro data_menu(request, kind, path, can_import) %}
<details class="relative" data-dropdown>
  <summary class="btn btn-secondary cursor-pointer list-none">Импорт / экспорт
    <svg class="ml-1 h-4 w-4" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M5.23 7.21a.75.75 0 011.06.02L10 11.17l3.71-3.94a.75.75 0 111.08 1.04l-4.25 4.5a.75.75 0 01-1.08 0l-4.25-4.5a.75.75 0 01.02-1.06z" clip-rule="evenodd"/></svg>
  </summary>
  <div class="absolute right-0 z-30 mt-2 w-64 rounded-xl bg-white p-1 shadow-lg ring-1 ring-slate-200">
    <p class="px-3 pb-1 pt-2 text-xs font-semibold uppercase tracking-wide text-slate-400">Выгрузить{% if request.query_params | length %} (с текущими фильтрами){% endif %}</p>
    <a href="{{ export_href(request, path ~ '/export', 'xlsx') }}" class="block rounded-lg px-3 py-2 text-sm text-slate-700 hover:bg-slate-100">Excel (.xlsx)</a>
    <a href="{{ export_href(request, path ~ '/export', 'csv') }}" class="block rounded-lg px-3 py-2 text-sm text-slate-700 hover:bg-slate-100">CSV</a>
    {% if can_import %}
    <div class="my-1 border-t border-slate-100"></div>
    <a href="/import/{{ kind }}" class="block rounded-lg px-3 py-2 text-sm text-slate-700 hover:bg-slate-100">Загрузить из файла…</a>
    {% endif %}
  </div>
</details>
{% endmacro %}
