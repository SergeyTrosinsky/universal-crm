<!DOCTYPE html>
<html lang="ru" class="h-full">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <title>{% block title %}{{ app_name }}{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
  <script>
    tailwind.config = {
      theme: { extend: { fontFamily: { sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'] } } }
    };
  </script>
  <style type="text/tailwindcss">
    @layer components {
      .btn { @apply inline-flex items-center justify-center gap-2 rounded-lg px-3.5 py-2 text-sm font-medium transition focus:outline-none focus-visible:ring-2 focus-visible:ring-offset-2 disabled:opacity-50; }
      .btn-primary { @apply bg-indigo-600 text-white shadow-sm hover:bg-indigo-500 focus-visible:ring-indigo-500; }
      .btn-secondary { @apply bg-white text-slate-700 ring-1 ring-inset ring-slate-300 hover:bg-slate-50 focus-visible:ring-slate-400; }
      .btn-danger { @apply bg-white text-rose-600 ring-1 ring-inset ring-rose-200 hover:bg-rose-50 focus-visible:ring-rose-500; }
      .input { @apply block w-full rounded-lg border-0 bg-white px-3 py-2 text-sm text-slate-900 shadow-sm ring-1 ring-inset ring-slate-300 placeholder:text-slate-400 focus:ring-2 focus:ring-inset focus:ring-indigo-500 disabled:bg-slate-100 disabled:text-slate-500; }
      .label { @apply mb-1 block text-sm font-medium text-slate-700; }
      .card { @apply rounded-xl bg-white shadow-sm ring-1 ring-slate-200; }
      .badge { @apply inline-flex items-center rounded-full px-2 py-0.5 text-xs font-medium; }
      .th { @apply px-4 py-3 text-left text-xs font-semibold uppercase tracking-wide text-slate-500; }
      .td { @apply px-4 py-3 text-sm text-slate-700; }
    }
  </style>
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body class="h-full bg-slate-50 font-sans text-slate-800 antialiased">
  {% if user %}{% include "partials/navbar.html" %}{% endif %}
  <main class="{% block main_class %}mx-auto max-w-6xl px-4 py-8{% endblock %}">
    {% block flash %}{% include "partials/flash.html" %}{% endblock %}
    {% block content %}{% endblock %}
  </main>
  <script src="/static/js/app.js" defer></script>
</body>
</html>
